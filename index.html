
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POWER BY INI NAKY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090910;
      color: white;
    }
    header {
      padding: 22px 16px;
      background: #151321;
      border-bottom: 1px solid #b58a35;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: #e6bd62;
      letter-spacing: 2px;
      font-size: 23px;
    }
    header p { color: #aaa; font-size: 12px; }
    nav {
      display: flex;
      justify-content: space-around;
      padding: 14px 5px;

    }
    nav a {

      text-decoration: none;
      font-size: 12px;
    }
    main { padding: 18px; }
    .welcome {
      padding: 25px 18px;
      border: 1px solid #a98539;
      border-radius: 15px;
      background: linear-gradient(135deg,#211b32,#11111b);
      text-align: center;
    }
    .welcome h2 { color: #e6bd62; }
    .welcome p { color: #bbb; font-size: 14px; }
    .section-title { color: #e6bd62; margin-top: 27px; }
    .menu {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
    }
    .item {
      padding: 20px 10px;
      background: #191824;
      border: 1px solid #393143;
      border-radius: 12px;
      text-align: center;
    }
    .item span { display: block; font-size: 27px; }
    .item strong { color: #e6bd62; font-size: 13px; }
    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>POWER BY INI NAKY</h1>

  </header>

  <nav>
    <a href="#">BERANDA</a>
    <a href="#chat">CHAT</a>
    <a href="#room">VOICE ROOM</a>
    <a href="#profil">PROFIL</a>

  <main>
    <section class="welcome">
      <h2>WELCOME TO POWER</h2>
      <p>Satu tempat untuk terhubung, berbagi cerita, dan membangun komunitas.</p>
    </section>

    <h3 class="section-title">FITUR UTAMA</h3>
    <section class="menu">
      <div class="item"><span>💬</span><strong>PRIVATE CHAT</strong></div>
      <div class="item"><span>👥</span><strong>GROUP CHAT</strong></div>
      <div class="item"><span>🎙️</span><strong>VOICE ROOM</strong></div>
      <div class="item"><span>📹</span><strong>VIDEO CALL</strong></div>

</html>
